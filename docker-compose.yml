services:
  mysql:
    image: mysql:8.0
    container_name: drivesense-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drivesense
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: drivesense
      MYSQL_PASSWORD: drivesense_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  drivesense:
    build: .
    container_name: drivesense-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=drivesense
      - DB_USER=drivesense
      - DB_PASSWORD=drivesense_password
      - PORT=8080

volumes:
  mysql_data:

