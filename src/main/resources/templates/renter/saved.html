<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Vehicles & Wishlist | DriveSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: var(--bg-dark); color: var(--text-primary);">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">

    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
            <div style="font-size: 0.85rem; font-weight: 600; color: #F43F5E; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem;">
                <i class="fa-solid fa-heart"></i> Personal Wishlist
            </div>
            <h1 style="font-size: 2.2rem; font-weight: 800; color: #fff;">Saved Vehicles</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.2rem;">
                Keep track of your favorite cars for weekend getaways, business trips, and road journeys.
            </p>
        </div>

        <a th:href="@{/cars}" class="btn btn-secondary">
            <i class="fa-solid fa-car"></i> Explore More Cars
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(savedCars)}" class="card text-center" style="padding: 4rem 2rem; border: 1px solid var(--border-dark); background: var(--surface-dark);">
        <i class="fa-regular fa-heart" style="font-size: 3.5rem; color: var(--text-muted); margin-bottom: 1.25rem;"></i>
        <h3 style="color: #fff; font-size: 1.35rem; margin-bottom: 0.5rem;">No Saved Vehicles Yet</h3>
        <p style="color: var(--text-muted); font-size: 0.92rem; max-width: 480px; margin: 0 auto 1.5rem auto;">
            Tap the heart icon on any vehicle card in the fleet catalogue to save it here for fast booking.
        </p>
        <a th:href="@{/cars}" class="btn btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i> Browse Vehicles
        </a>
    </div>

    <!-- Vehicle Grid -->
    <div th:unless="${#lists.isEmpty(savedCars)}" class="car-grid">
        <th:block th:each="car : ${savedCars}">
            <div th:replace="~{fragments/car-card :: car-card(car=${car})}"></div>
        </th:block>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
